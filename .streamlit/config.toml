# TRAK-AI KDS — Streamlit Configuration
# Theme: Precision Agriculture (Dark Default)
# Override via sidebar toggle (☀️ Light / 🌙 Dark / 🖥️ System)
# Alternative light-base reference: see config_light.toml

[theme]
base = "dark"
primaryColor              = "#66BB6A"   # Vivid green (dark-readable)
backgroundColor           = "#0A1A0A"   # Deep forest
secondaryBackgroundColor  = "#162616"   # Card surface
textColor                 = "#E8F5E9"   # Near-white green tint
linkColor                 = "#FFD54F"   # Golden yellow (accent)
font                      = "sans serif"

[browser]
gatherUsageStats = false

[server]
headless = false

[client]
showErrorDetails = true
toolbarMode      = "minimal"
