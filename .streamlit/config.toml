# TRAK-AI KDS — Streamlit configuration
# Light base; styling.py CSS hem light hem dark mode'u handle eder.
# Kullanıcı sidebar'dan ☀️ Aydınlık / 🌙 Karanlık / 🖥️ Sistem seçebilir.
# Streamlit hamburger menü ayarları kontrast iyileştirmesi için tweak edildi.

[theme]
base = "light"
primaryColor          = "#2E7D32"
backgroundColor       = "#FFFFFF"
secondaryBackgroundColor = "#F5F7F4"
textColor             = "#1F2A24"
linkColor             = "#1976D2"
font                  = "sans serif"

[browser]
gatherUsageStats = false

[server]
headless = false
