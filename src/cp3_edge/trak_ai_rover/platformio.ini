; Default environment: USB.  OTA env opsiyonel (-e esp32dev_ota ile çalıştırılır).
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient @ ^2.8.0
    adafruit/DHT sensor library @ ^1.4.4
    adafruit/Adafruit Unified Sensor @ ^1.1.9
    mikalhart/TinyGPSPlus @ ^1.0.3
    bblanchon/ArduinoJson @ ^7.0.0

; ───────────────────────────────────────────────────────────────────
; OTA (Over-The-Air) — WiFi üzerinden firmware update
; Önce USB ile bir kez yükle (ArduinoOTA.begin() koda eklenmiş olmalı)
; Sonra:  pio run -e esp32dev_ota -t upload
; ───────────────────────────────────────────────────────────────────
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = trak-ai-rover.local      ; mDNS hostname (DHCP IP değişse de çalışır)
; Alternatif: upload_port = 192.168.1.100  (sabit IP biliniyorsa)
upload_flags =
    --auth=trakai2026
    --port=3232
    --timeout=60