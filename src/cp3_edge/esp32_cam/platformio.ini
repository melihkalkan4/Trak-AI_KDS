[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; CH340G adapter DTR/RTS bağlı değil — esptool reset gönderemez.
; ESP32'yi manuel olarak download mode'a sok (GPIO0=GND + RST), sonra upload.
upload_flags =
    --before
    no_reset
    --after
    hard_reset

; Manuel boot prosedürü:
;   1. GPIO0 → GND köprüle (kalıcı)
;   2. RST butonuna kısa BAS + BIRAK
;   3. PowerShell ile boot mesajı kontrol et:
;      "waiting for download" görüyorsan → ESP32 hazır
;   4. Upload komutunu çalıştır → direkt yazmaya başlamalı
;   5. Upload bitince: GPIO0 köprüsünü aç, RST'ye tekrar bas

board_build.partitions = huge_app.csv

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0